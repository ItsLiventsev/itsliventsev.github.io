name: activity

# Обновляет снимок истории основной ветки для блока активности на главной.
# Прямой запрос к api.github.com из браузера упирается в лимит 60 запросов в час
# на IP, поэтому сайт читает assets/data/activity.json, а этот workflow держит
# файл актуальным: на каждый пуш в main и раз в сутки по расписанию.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/data/activity.json'
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build activity snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-activity.js

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/activity.json
          if git diff --staged --quiet; then
            echo "Снимок не изменился"
          else
            git commit -m "chore(activity): снимок истории за 30 дней"
            git push
          fi
