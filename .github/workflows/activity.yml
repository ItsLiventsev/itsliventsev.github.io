name: activity

# Обновляет снимок истории основной ветки для блока активности на главной.
# Прямой запрос к api.github.com из браузера упирается в лимит 60 запросов в час
# на IP, поэтому сайт читает assets/data/activity.json, а этот workflow держит
# файл актуальным: на каждый пуш в main и раз в сутки по расписанию.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/data/activity.json'
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Один писатель в main за раз: post-index и activity коммитят в одну ветку.
concurrency:
  group: main-commits
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build activity snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-activity.js

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/activity.json
          if git diff --staged --quiet; then
            echo "Снимок не изменился"
            exit 0
          fi
          git commit -m "chore(activity): снимок истории за 30 дней"
          # post-index может закоммитить в main первым: перебазируемся и пробуем снова.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Снимок отправлен (попытка $attempt)"
              exit 0
            fi
            echo "push отклонён, перебазируемся (попытка $attempt)"
            git pull --rebase origin main
          done
          echo "::error::не удалось отправить снимок после трёх попыток"
          exit 1
