name: post-index

# Автоматически пересобирает posts.json, feed-counts.json, sitemap.xml и feed.xml,
# когда в контентных папках появляется/меняется HTML-страница,
# а также освежает SEO-блоки (canonical, OG, JSON-LD) во всех страницах.
on:
  push:
    paths:
      - 'blog/**.html'
      - 'articles/**.html'
      - 'projects/**.html'
      - 'archive/**.html'
      - '*.html'
      - 'scripts/build-post-index.js'
      - 'scripts/build-seo.js'
      - '.github/workflows/post-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build post indexes and feed counts
        run: node scripts/build-post-index.js

      - name: Build SEO artifacts (sitemap, RSS, meta blocks)
        run: node scripts/build-seo.js

      - name: Commit updated manifests and SEO artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts.json articles/posts.json feed-counts.json sitemap.xml feed.xml
          git add '*.html' 'blog/*.html' 'articles/*.html' 'projects/*.html' 'archive/*.html'
          if git diff --staged --quiet; then
            echo "Изменений для коммита нет"
          else
            git commit -m "chore: авто-обновление индексов, sitemap и SEO-разметки"
            git push
          fi
