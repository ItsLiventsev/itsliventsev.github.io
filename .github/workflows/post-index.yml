name: post-index

# Автоматически пересобирает базу знаний (страницы заметок, рубрики, граф, ленту),
# затем posts.json, поисковый индекс, feed-counts.json, sitemap.xml и feed.xml,
# когда в контентных папках появляется/меняется HTML-страница,
# а также освежает SEO-блоки (canonical, OG, JSON-LD) во всех страницах.
on:
  push:
    branches: [main]
    paths:
      - 'blog/**.html'
      - 'assets/data/knowledge/**'
      - 'scripts/build-knowledge.js'
      - 'articles/**.html'
      - 'projects/**.html'
      - 'archive/**.html'
      - 'stands/**.html'
      - '*.html'
      - 'scripts/build-post-index.js'
      - 'scripts/build-search-index.py'
      - 'scripts/build-seo.js'
      - 'scripts/build-og.js'
      - 'assets/og*.svg'
      - '.github/workflows/post-index.yml'
  workflow_dispatch:

# Один писатель в main за раз: post-index и activity коммитят в одну ветку.
concurrency:
  group: main-commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build knowledge base (notes, topics, graph, blog feed)
        run: node scripts/build-knowledge.js

      - name: Build post indexes, search index and feed counts
        run: |
          node scripts/build-post-index.js
          python3 scripts/build-search-index.py

      - name: Build SEO artifacts (sitemap, RSS, meta blocks)
        run: node scripts/build-seo.js

      # OG-карточки 1200×630: SVG и PNG собираются одним шаблоном, поэтому
      # картинки в соцсетях не отстают от заголовков и чисел на страницах.
      # Зависимости живут вне репозитория (.ogbuild/ в .gitignore).
      - name: Install OG renderer outside the repository
        run: |
          npm install --prefix "$RUNNER_TEMP/og" --no-audit --no-fund \
            @resvg/resvg-js@2.6.2 \
            @expo-google-fonts/golos-text@0.4.2 \
            @expo-google-fonts/literata@0.4.3 \
            @expo-google-fonts/jetbrains-mono

      - name: Build OG cards
        env:
          OG_DEPS: ${{ runner.temp }}/og
          OG_FONTS: ${{ runner.temp }}/og/node_modules/@expo-google-fonts
        run: node scripts/build-og.js

      - name: Commit updated manifests and SEO artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts.json articles/posts.json feed-counts.json sitemap.xml feed.xml assets/search-index.json
          git add assets/data/knowledge/registry.json
          git add assets/og.svg assets/og.png assets/og-notes.svg assets/og-notes.png
          git add assets/og-stands.svg assets/og-stands.png assets/og-ops.svg assets/og-ops.png
          git add assets/og-office.svg assets/og-office.png
          git add '*.html' 'blog/*.html' 'blog/topics/*.html' 'articles/*.html' 'projects/*.html' 'archive/*.html'
          if git diff --staged --quiet; then
            echo "Изменений для коммита нет"
            exit 0
          fi
          git commit -m "chore: авто-обновление индексов, sitemap и SEO-разметки"
          # Второй бот может успеть первым: перебазируемся и пробуем снова.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Индексы отправлены (попытка $attempt)"
              exit 0
            fi
            echo "push отклонён, перебазируемся (попытка $attempt)"
            git pull --rebase origin main
          done
          echo "::error::не удалось отправить артефакты после трёх попыток"
          exit 1
