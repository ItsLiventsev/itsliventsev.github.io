name: site-checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static and service worker checks
        run: |
          python3 scripts/audit-html.py
          node scripts/regression-static.js
          node scripts/runtime-smoke.js
          node scripts/test-service-worker.js
          node scripts/test-palette.js
      - name: Install browser test dependencies outside the repository
        run: |
          npm install --prefix "$RUNNER_TEMP/site-tests" --no-audit --no-fund jsdom@30.1.3 playwright@1.64.1 axe-core@4.10.3
          "$RUNNER_TEMP/site-tests/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/site-tests/node_modules" >> "$GITHUB_ENV"
      - name: Activity and real offline checks
        run: |
          node scripts/test-activity.js
          node scripts/test-search.js
          node scripts/test-reading.js
          node scripts/browser-offline.js
      - name: Browser interaction checks
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/site-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          for test in browser-smoke browser-reading; do
            if node "scripts/$test.js" > "$RUNNER_TEMP/$test.log" 2>&1; then
              cat "$RUNNER_TEMP/$test.log"
            else
              cat "$RUNNER_TEMP/$test.log"
              detail=$(tail -20 "$RUNNER_TEMP/$test.log" | tr '\n' ' ' | sed 's/%/%25/g;s/\r/%0D/g')
              echo "::error::$test failed: $detail"
              exit 1
            fi
          done
