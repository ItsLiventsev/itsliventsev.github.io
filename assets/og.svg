<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#18181b" opacity="0.055"/>
    </pattern>
  </defs>

  <!-- Фон + фирменная сетка точек -->
  <rect width="1200" height="630" fill="#fafafa"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Гигантские водяные глифы -->
  <text x="905" y="330" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="430" font-weight="800" fill="#2563eb" opacity="0.07">/</text>
  <text x="640" y="560" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="300" font-weight="800" fill="#2563eb" opacity="0.05">#</text>
  <text x="1080" y="150" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="170" font-weight="800" fill="#2563eb" opacity="0.045">{ }</text>

  <!-- Знак бренда: тёмный плашка-терминал -->
  <rect x="96" y="176" width="132" height="132" rx="28" fill="#18181b"/>
  <path d="M128 218l22 24-22 24" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="162" y1="266" x2="202" y2="266" stroke="#fafafa" stroke-width="10" stroke-linecap="round"/>

  <!-- Вордмарк -->
  <text x="262" y="248" font-family="Inter,system-ui,sans-serif" font-size="86" font-weight="800" fill="#18181b">itsliventsev</text>
  <text x="264" y="292" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="27" font-weight="500" fill="#71717a">// заметки · статьи · проекты · учебные материалы</text>

  <!-- Нижняя подпись -->
  <rect x="96" y="430" width="1008" height="1.6" fill="#e4e4e7"/>
  <text x="96" y="492" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="26" font-weight="600" fill="#2563eb">сети · системное администрирование · IT-образование</text>
  <text x="96" y="536" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#a1a1aa">itsliventsev.github.io</text>
